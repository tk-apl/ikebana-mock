<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機能チェック</title>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sep:#E5E5EA; --fill:#E3E3E8;
  --text:#1C1C1E; --text-2:#6E6E73; --accent:#1971C2; --on-accent:#FFFFFF; --warn:#B35C00; --ok:#2B7A3D;
  --r:12px; --gutter:16px;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:120px}
button,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:34px;font-weight:700;line-height:1.2;padding:24px var(--gutter) 4px}
.lead{padding:0 var(--gutter);color:var(--text-2);font-size:14px}
.stats{display:flex;gap:8px;padding:16px var(--gutter) 0}
.stat{flex:1;background:var(--surface);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text-2)}
.lens{margin:16px var(--gutter) 0;background:var(--surface);border-radius:var(--r);padding:12px 16px}
.lens h3{font-size:13px;color:var(--text-2);font-weight:400;margin-bottom:4px}
.lens ul{padding-left:1.2em;font-size:14px}
.sec-h{font-size:13px;color:var(--text-2);padding:0 calc(var(--gutter) + 16px) 6px;margin-top:28px;display:flex;justify-content:space-between}
.item{margin:0 var(--gutter) 12px;background:var(--surface);border-radius:var(--r);overflow:hidden}
.item-h{display:flex;gap:12px;align-items:baseline;padding:12px 16px 6px}
.item-h .no{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;flex:none;width:2.4em}
.item-h .ttl{font-size:17px;font-weight:600;flex:1}
.item-h a{font-size:14px;color:var(--accent);text-decoration:none;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center}
.body{padding:0 16px 12px calc(16px + 2.4em + 12px);font-size:14px}
.body dt{color:var(--text-2);font-size:13px;margin-top:6px}
.body ol,.body ul{padding-left:1.2em}
.res{display:flex;gap:2px;margin:10px 16px 0;padding:2px;background:var(--fill);border-radius:10px}
.res button{flex:1;min-height:40px;border-radius:8px;font-size:15px}
.res button.on[data-v="ok"]{background:var(--ok);color:#fff}
.res button.on[data-v="ng"]{background:var(--warn);color:#fff}
.res button.on[data-v="skip"]{background:var(--text-2);color:#fff}
.memo{display:block;width:calc(100% - 32px);margin:8px 16px 14px;min-height:44px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px;resize:vertical}
.memo:focus{outline:2px solid var(--accent)}
.item.ng{box-shadow:inset 3px 0 0 var(--warn)}
.item.ok{box-shadow:inset 3px 0 0 var(--ok)}
.foot{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -.5px 0 var(--sep);padding:10px var(--gutter) calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot .sum{flex:1;font-size:13px;color:var(--text-2)}
.btn{min-height:48px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 18px}
.btn.ghost{background:var(--surface);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(28,28,30,.94);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>機能チェック</h1>
  <p class="lead">いけばな予約アプリ（モック）を、使う場面の順になぞる。「開く」で該当の画面がモックで開く。</p>
  <div class="stats" id="stats"></div>
  <div class="lens">
    <h3>どの項目でも見ること</h3>
    <ul>
      <li>次に押すものが、画面を見ただけで分かるか</li>
      <li>言葉が自然か。意味が取れない語はないか</li>
      <li>タップの数・スクロールの量が多すぎないか</li>
      <li>押したあと、何が起きたかが分かるか。戻れるか</li>
      <li>今の運用（帰りぎわ・LINE）より楽になっているか</li>
    </ul>
  </div>
  <div id="list"></div>
</div>
<div class="foot"><div class="in"><div class="sum" id="footSum"></div><button class="btn ghost" id="reset">消す</button><button class="btn" id="copy">結果をコピー</button></div></div>

<script>
const MOCK = location.pathname.includes('/ikebana/check/') ? '../mock/index.html' : '../index.html';
const ITEMS = [
  ['生徒', [
    ['s1','はじめて開く','?role=student&tab=cal',
      ['アプリを開く','「次の稽古日」とカレンダーを眺める'],
      '開く日・休みの日・自分の予約が一目で分かるか。研究会の日が分かるか'],
    ['s2','いつもの内容で予約する','?role=student&tab=cal',
      ['「次の稽古日」から受付中の日を押す','下の「予約する」を押す'],
      '2タップで済むか。最初から入っているセットと時間が自分に合っているか'],
    ['s3','セットと時間を変えて予約する','?role=student&tab=cal',
      ['受付中の日を選ぶ','セットを選び直す','時間帯→時刻の順に選ぶ','予約する'],
      '時間帯と時刻の2段は迷わないか。人数の表示と「満」は役に立つか'],
    ['s4','花材を選ぶ・希望を書く','?role=student&tab=cal',
      ['受付中の日でセットを「生花」にする','花材の候補と本数を選ぶ','「花材の希望」も書いて予約する'],
      '候補から選ぶ流れは自然か。書いた内容がどこに出るか'],
    ['s5','予約を変える','?role=student&tab=cal',
      ['予約済みの日を開く','「予約内容の変更」で時間を変える','「この内容に変更する」を押す（一度は「やめる」も試す）'],
      '今の予約と変えたあとの区別がつくか'],
    ['s6','予約をキャンセルする','?role=student&tab=mine',
      ['予定タブで「キャンセル」','確認のシートで「予約をキャンセルする」（一度は「やめる」も試す）','「元に戻す」で戻す'],
      '確認の重さはちょうどよいか。キャンセルしたことが分かるか'],
    ['s7','確定した予約を見る','?role=student&tab=cal',
      ['今日（10月4日）の予約を開く','「欠席を連絡する」を押す','「欠席の連絡を取り消す」で戻す'],
      '日曜24時を過ぎると「確定」になり、キャンセルできないことが伝わるか。欠席の連絡は迷わないか'],
    ['s8','休みになった日の予約を見る','?role=student&tab=mine',
      ['先生で見るに切り替え、予約がある日を「休み」にする','生徒で見るに戻して予定タブを開く'],
      '休みになったことに気づけるか'],
    ['s9','予定を確かめる','?role=student&tab=mine',
      ['予定タブを開く','行を押してその日へ移る'],
      '一覧で足りるか。その日へ移ったとき迷わないか'],
    ['s10','稽古の記録を残す','?role=student&tab=rec',
      ['記録タブを開く','写真を入れ、一言を書く'],
      '予約に絞るなら要るか（記録タブを残すかは未決）'],
    ['s11','お知らせを読む','?role=student&tab=notice',
      ['お知らせタブを開く','お知らせを押して全文を読む'],
      'タイトルと書き出しで中身が分かるか。届いたことに気づけるか'],
  ]],
  ['先生', [
    ['t1','月初に開催日を決める','?role=teacher&tab=cal',
      ['カレンダーで日を選ぶ','「状態」で開催・休み・未定・研究会を切り替える','次の月も同じようにする'],
      '1日ずつ切り替える手間は許容できるか（まとめて決める画面は未決）'],
    ['t2','その日の予約と混み具合を見る','?role=teacher&tab=cal',
      ['開催日を選ぶ','予約の一覧、セット別の数、時間ごとの人数を見る'],
      '知りたい順に並んでいるか。人数と時間が読み取りやすいか'],
    ['t3','帰りぎわに言われた予約を入れる','?role=teacher&tab=roster',
      ['名簿で名前を検索して開く','「予約を入れる」で日付・セット・時間を選ぶ','「入れる」'],
      '会話しながら手早く入れられるか。既定値は合っているか'],
    ['t4','日付から代わりに入れる','?role=teacher&tab=cal',
      ['開催日を選ぶ','「予約を入れる」で名前を検索し、セット・時間を選ぶ','「入れる」'],
      '名前が多いとき（40人）に探せるか'],
    ['t5','予約をキャンセルする','?role=teacher&tab=cal',
      ['予約の一覧で「キャンセル」','確認のシートで「予約をキャンセルする」','「元に戻す」'],
      '他の生徒の予約を誤って消す心配はないか。確定後も先生だけキャンセルできることでよいか'],
    ['t6','予約内容を変更する','?role=teacher&tab=cal',
      ['予約の一覧で「変更」','セット・時間・花材を直す（確定した日は出欠も）','「保存する」'],
      '生徒の書いた希望と先生が直したものの区別は要るか'],
    ['t7','日曜に発注する','?role=teacher&tab=order',
      ['発注タブを開く','セット別の数と花材の希望を見る','「文面をコピーする」'],
      'そのまま業者に送れる文面か。生徒の名前を載せてよいか'],
    ['t8','確定した日の予約を見る','?role=teacher&tab=cal',
      ['日曜24時を過ぎた日（10月4日）を開く','見出しの欠席の人数と、行の「欠席」を見る'],
      '確定した人数で花材をそろえる流れに合っているか。当日休んだ人の花材代をどうするか'],
    ['t9','お知らせを送る','?role=teacher&tab=notice',
      ['「送る」から宛先を選ぶ','タイトルと本文を書いて送る'],
      '使う通数と残りが分かるか。宛先の選び方は自然か'],
    ['t10','名簿を整える','?role=teacher&tab=roster',
      ['「生徒を追加する」','課程を変える','名簿を名前で検索する'],
      '課程の選び方は合っているか（現代華と生花の両方など）'],
  ]],
  ['共通', [
    ['c1','戻る操作','?role=student&tab=cal',
      ['シートを開いてスマホの戻る','名簿の生徒を開いてスマホの戻る'],
      'アプリが閉じずに一つずつ戻るか'],
    ['c2','押したときの手応え','?role=student&tab=cal',
      ['いろいろなボタンを押す'],
      '波紋が自然か。反応が遅く感じないか'],
    ['c3','見た目と文字','?role=student&tab=cal',
      ['屋外や暗い場所でも見る'],
      '文字の大きさ・色の薄さ・青の色味は読みやすいか'],
    ['c4','ホーム画面から使う','',
      ['iPhoneのSafariで公開先を開き、ホーム画面に追加','アイコンから起動する'],
      'アプリらしく開くか。アイコンと名前は分かりやすいか'],
  ]],
];
const KEY = 'ikebana-check-v1';
let R = {}; try{ R = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ R = {}; }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(R)); }catch(e){} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all = ITEMS.flatMap(([g, list]) => list.map(it => ({g, id:it[0], ttl:it[1], url:it[2], steps:it[3], look:it[4]})));
const LABEL = {ok:'OK', ng:'気になる', skip:'飛ばす'};

function render(){
  document.getElementById('list').innerHTML = ITEMS.map(([g, list]) => `<div class="sec-h"><span>${g}</span><span>${list.length}件</span></div>` + list.map(it => {
    const [id, ttl, url, steps, look] = it; const r = R[id] || {};
    return `<div class="item ${r.v||''}" id="${id}"><div class="item-h"><span class="no">${id.toUpperCase()}</span><span class="ttl">${esc(ttl)}</span>${url?`<a href="${MOCK}${url}" target="mock">開く</a>`:''}</div>
      <dl class="body"><dt>手順</dt><dd><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></dd><dt>見るところ</dt><dd>${esc(look)}</dd></dl>
      <div class="res">${['ok','ng','skip'].map(v=>`<button data-id="${id}" data-v="${v}" class="${r.v===v?'on':''}">${LABEL[v]}</button>`).join('')}</div>
      <textarea class="memo" data-memo="${id}" placeholder="気づいたこと">${esc(r.m||'')}</textarea></div>`;
  }).join('')).join('');
  stats();
}
function stats(){
  const n = all.length, ok = all.filter(x=>R[x.id]?.v==='ok').length, ng = all.filter(x=>R[x.id]?.v==='ng').length, done = all.filter(x=>R[x.id]?.v).length;
  document.getElementById('stats').innerHTML = `<div class="stat"><b>${done}/${n}</b><span>済</span></div><div class="stat"><b>${ok}</b><span>OK</span></div><div class="stat"><b>${ng}</b><span>気になる</span></div>`;
  document.getElementById('footSum').textContent = `${done}/${n} 済・気になる ${ng}`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.res button'); if(!b) return;
  const id = b.dataset.id, v = b.dataset.v; R[id] = R[id] || {}; R[id].v = (R[id].v === v) ? '' : v; save();
  const card = document.getElementById(id); card.className = 'item ' + (R[id].v||'');
  card.querySelectorAll('.res button').forEach(x => x.classList.toggle('on', x.dataset.v === R[id].v)); stats();
});
document.addEventListener('input', e => { const id = e.target.dataset.memo; if(!id) return; R[id] = R[id] || {}; R[id].m = e.target.value; save(); });
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 1800); }
document.getElementById('copy').addEventListener('click', () => {
  const lines = ['いけばな予約アプリ 機能チェックの結果', ''];
  for(const [g, list] of ITEMS){ lines.push(`【${g}】`); for(const it of list){ const r = R[it[0]] || {}; lines.push(`${it[0].toUpperCase()} ${it[1]}: ${LABEL[r.v]||'未'}${r.m?` ／ ${r.m.replace(/\n/g,' ')}`:''}`); } lines.push(''); }
  const text = lines.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>toast('コピーしました'), ()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした'); } ta.remove(); });
});
document.getElementById('reset').addEventListener('click', () => { if(!confirm('結果とメモを全部消しますか')) return; R = {}; save(); render(); });
render();
</script>
</body>
</html>
