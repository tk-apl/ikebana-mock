<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>押したときの反応</title>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sep:#E5E5EA; --fill:#E3E3E8;
  --text:#1C1C1E; --text-2:#6E6E73; --text-3:#AEAEB2;
  --accent:#1971C2; --on-accent:#FFFFFF; --hl:rgba(0,0,0,.08);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding:0 0 60px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{font-size:34px;font-weight:700;padding:56px 16px 4px}
.lead{font-size:15px;color:var(--text-2);padding:0 16px}
h2{font-size:22px;font-weight:700;padding:36px 16px 0}
.opt{margin-top:16px}
.opt-h{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--text-2);padding:0 32px 6px}
.opt-h b{font-size:15px;color:var(--text);font-weight:600}
.group{margin:0 16px;background:var(--surface);border-radius:12px;overflow:hidden;position:relative}
.row{position:relative;display:flex;align-items:center;width:100%;min-height:44px;padding:11px 16px;text-align:left;font-size:17px}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row .r{margin-left:auto;color:var(--text-2)}
.row .chev{color:#C7C7CC;font-size:20px;margin-left:auto}
.pad{margin:0 16px}

/* 波紋（今） */
.rip{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;opacity:.2;transform:scale(0);animation:rp .45s cubic-bezier(.2,.6,.3,1) forwards;pointer-events:none;background:currentColor}
@keyframes rp{to{transform:scale(1)}}
.ripple.out{transition:opacity .25s;opacity:0}

/* 行 B: ハイライト（押した瞬間に灰、離すとすっと消える） */
.hl{transition:background-color .35s ease-out}
.hl.down{background:var(--hl);transition:none}
/* 行 C: ハイライト＋中身がわずかに沈む */
.hl2 > span{transition:transform .35s var(--spring)}
.hl2.down > span{transform:scale(.97);transition:transform .08s ease-out}

/* 主ボタン */
.btn{display:block;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600}
.spring{transition:transform .45s var(--spring), filter .3s}
.spring.down{transform:scale(.95);transition:transform .1s ease-out, filter .1s}
.spring2.down{filter:brightness(.88)}

/* 切り替え */
.segc{position:relative;display:flex;gap:2px;margin:0 16px;padding:2px;background:var(--fill);border-radius:10px}
.segc button{position:relative;z-index:1;flex:1;min-height:40px;border-radius:8px;font-size:15px;font-weight:500;transition:color .2s}
.segc.inst button.on{background:var(--accent);color:var(--on-accent)}
.segc button.on{color:var(--on-accent)}
.segc .pill{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--accent);z-index:0}
.segc.slide .pill{transition:left .28s var(--ease), width .28s var(--ease)}
.segc.bounce .pill{transition:left .5s var(--spring), width .5s var(--spring)}
.segc.bounce button.down{transform:scale(.94);transition:transform .08s}
.segc.bounce button{transition:transform .4s var(--spring), color .2s}

/* カレンダー */
.week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 16px;padding:8px;background:var(--surface);border-radius:12px}
.week button{position:relative;z-index:1;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:600;line-height:1.2}
.week button small{font-size:12px;font-weight:400;color:var(--accent)}
.week.inst button.on,.week button.on{color:var(--on-accent)}
.week button.on small{color:var(--on-accent)}
.week.inst button.on{background:var(--accent)}
.week .pill{position:absolute;border-radius:10px;background:var(--accent);z-index:0;transition:left .32s var(--ease), top .32s var(--ease)}
.week.pop button.on{background:var(--accent);animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(.82)}to{transform:scale(1)}}

/* チェック */
.check{width:22px;height:22px;margin-left:auto;flex:none}
.check path{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.draw .check path{stroke-dasharray:22;stroke-dashoffset:22}
.draw .on .check path{stroke-dashoffset:0;transition:stroke-dashoffset .28s var(--ease) .04s}
.inst2 .check path{opacity:0}
.inst2 .on .check path{opacity:1}
.tint .row.on{background:color-mix(in srgb, var(--accent) 8%, transparent);transition:background-color .25s}
.tint .row{transition:background-color .25s}

/* 写真 */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.ph{display:block;width:100%;aspect-ratio:4/5;border-radius:12px;background:linear-gradient(160deg,#C9D8E8,#E9DCCB);position:relative}
.ph span{position:absolute;left:10px;bottom:8px;font-size:13px;color:#3A3A3C}
.shrink{transition:transform .15s ease-out, filter .15s ease-out}
.shrink.down{transform:scale(.97);filter:brightness(.9)}
.sprph{transition:transform .5s var(--spring), filter .3s}
.sprph.down{transform:scale(.94);filter:brightness(.92);transition:transform .12s ease-out, filter .12s}
.lift{transition:transform .4s var(--spring), box-shadow .4s}
.lift.down{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 24px rgba(0,0,0,.18);transition:transform .15s ease-out, box-shadow .15s}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<h1>押したときの反応</h1>
<p class="lead">それぞれ押して比べてください。</p>

<h2>一覧の行</h2>
<div class="opt"><div class="opt-h"><b>A</b>波紋（今）</div>
  <div class="group"><button class="row rip" data-fx="ripple">予約内容の変更<span class="chev">›</span></button><button class="row rip" data-fx="ripple">欠席を連絡する<span class="chev">›</span></button></div></div>
<div class="opt"><div class="opt-h"><b>B</b>灰色に光る</div>
  <div class="group"><button class="row hl" data-fx="down">予約内容の変更<span class="chev">›</span></button><button class="row hl" data-fx="down">欠席を連絡する<span class="chev">›</span></button></div></div>
<div class="opt"><div class="opt-h"><b>C</b>光る＋文字が沈む</div>
  <div class="group"><button class="row hl hl2" data-fx="down"><span>予約内容の変更</span><span class="chev">›</span></button><button class="row hl hl2" data-fx="down"><span>欠席を連絡する</span><span class="chev">›</span></button></div></div>

<h2>主ボタン</h2>
<div class="opt"><div class="opt-h"><b>A</b>波紋（今）</div><div class="pad"><button class="btn rip" data-fx="ripple">予約する</button></div></div>
<div class="opt"><div class="opt-h"><b>B</b>縮んで、ばねで戻る</div><div class="pad"><button class="btn spring" data-fx="down">予約する</button></div></div>
<div class="opt"><div class="opt-h"><b>C</b>縮む＋色が沈む</div><div class="pad"><button class="btn spring spring2" data-fx="down">予約する</button></div></div>

<h2>切り替え</h2>
<div class="opt"><div class="opt-h"><b>A</b>波紋・すぐ切り替わる（今）</div>
  <div class="segc inst" data-seg><button class="rip on" data-fx="ripple">午前</button><button class="rip" data-fx="ripple">昼</button><button class="rip" data-fx="ripple">夕方</button><button class="rip" data-fx="ripple">夜</button></div></div>
<div class="opt"><div class="opt-h"><b>B</b>選択が滑って移る</div>
  <div class="segc slide" data-seg><i class="pill"></i><button class="on">午前</button><button>昼</button><button>夕方</button><button>夜</button></div></div>
<div class="opt"><div class="opt-h"><b>C</b>滑る＋ばね</div>
  <div class="segc bounce" data-seg><i class="pill"></i><button class="on" data-fx="down">午前</button><button data-fx="down">昼</button><button data-fx="down">夕方</button><button data-fx="down">夜</button></div></div>

<h2>カレンダーのマス</h2>
<div class="opt"><div class="opt-h"><b>A</b>波紋・すぐ切り替わる（今）</div>
  <div class="week inst" data-week></div></div>
<div class="opt"><div class="opt-h"><b>B</b>選択が滑って移る</div>
  <div class="week slide" data-week><i class="pill"></i></div></div>
<div class="opt"><div class="opt-h"><b>C</b>ふわっと膨らむ</div>
  <div class="week pop" data-week></div></div>

<h2>選ぶ行</h2>
<div class="opt"><div class="opt-h"><b>A</b>すぐ付く（今）</div>
  <div class="group inst2" data-pick></div></div>
<div class="opt"><div class="opt-h"><b>B</b>チェックが描かれる</div>
  <div class="group draw" data-pick></div></div>
<div class="opt"><div class="opt-h"><b>C</b>描かれる＋行が色づく</div>
  <div class="group draw tint" data-pick></div></div>

<h2>写真</h2>
<div class="opt"><div class="opt-h"><b>A</b>縮んで暗くなる（今）</div>
  <div class="photos"><button class="ph shrink" data-fx="down"><span>10月1日</span></button><button class="ph shrink" data-fx="down"><span>9月27日</span></button></div></div>
<div class="opt"><div class="opt-h"><b>B</b>縮んで、ばねで戻る</div>
  <div class="photos"><button class="ph sprph" data-fx="down"><span>10月1日</span></button><button class="ph sprph" data-fx="down"><span>9月27日</span></button></div></div>
<div class="opt"><div class="opt-h"><b>C</b>持ち上がる</div>
  <div class="photos"><button class="ph lift" data-fx="down"><span>10月1日</span></button><button class="ph lift" data-fx="down"><span>9月27日</span></button></div></div>

<script>
/* 押している間 .down、離すと外す（離したあとの戻りは CSS のばねで描く） */
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-fx]'); if(!t) return;
  if(t.dataset.fx === 'down'){ t.classList.add('down'); const up = () => t.classList.remove('down'); addEventListener('pointerup', up, {once:true}); addEventListener('pointercancel', up, {once:true}); return; }
  const r = t.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const d = 2 * Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y));
  const dot = document.createElement('span'); dot.className = 'ripple';
  Object.assign(dot.style, {width:d+'px', height:d+'px', left:(x-d/2)+'px', top:(y-d/2)+'px'});
  t.appendChild(dot); const born = Date.now();
  const end = () => setTimeout(() => { dot.classList.add('out'); setTimeout(() => dot.remove(), 260); }, Math.max(0, 180 - (Date.now() - born)));
  addEventListener('pointerup', end, {once:true}); addEventListener('pointercancel', end, {once:true});
}, {passive:true});

/* 切り替え */
function placePill(box, el){ const p = box.querySelector('.pill'); if(!p) return; p.style.left = el.offsetLeft + 'px'; p.style.width = el.offsetWidth + 'px'; if(box.classList.contains('week')){ p.style.top = el.offsetTop + 'px'; p.style.height = el.offsetHeight + 'px'; } }
document.querySelectorAll('[data-seg]').forEach(box => {
  box.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); placePill(box, b); });
});
/* カレンダー */
const DAYS = [['4','確定'],['5',''],['6',''],['7',''],['8','開催'],['9',''],['10','']];
document.querySelectorAll('[data-week]').forEach(box => {
  const fx = box.classList.contains('inst') ? ' class="rip" data-fx="ripple"' : '';
  box.insertAdjacentHTML('beforeend', DAYS.map(([d,s], i) => `<button${fx}${i===4?' data-on':''}>${d}<small>${s}</small></button>`).join(''));
  const first = box.querySelector('[data-on]'); first.classList.add('on');
  box.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
    box.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    if(box.classList.contains('pop')) void b.offsetWidth;
    b.classList.add('on'); placePill(box, b); });
});
/* 選ぶ行 */
const SETS = ['基本花型','現代華','生花'];
document.querySelectorAll('[data-pick]').forEach(box => {
  box.innerHTML = SETS.map((s, i) => `<button class="row${i===1?' on':''}">${s}<svg class="check" viewBox="0 0 22 22"><path d="M5 11.5l4 4 8-9"/></svg></button>`).join('');
  box.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
});
const layout = () => document.querySelectorAll('[data-seg],[data-week]').forEach(box => { const on = box.querySelector('button.on'); if(on){ const p = box.querySelector('.pill'); if(p){ const tr = p.style.transition; p.style.transition = 'none'; placePill(box, on); void p.offsetWidth; p.style.transition = tr; } } });
addEventListener('load', layout); addEventListener('resize', layout); layout();
</script>
</body>
</html>
